# ===================================================================
# CONFIGURACIÓN PRODUCCIÓN CON BASE DE DATOS MYSQL
# ===================================================================
spring.datasource.url=${CLINICA_DB_URL:jdbc:mysql://localhost:3306/clinica_odontologica_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${CLINICA_DB_USUARIO}
spring.datasource.password=${CLINICA_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate con dialecto MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de SQL si se requiere
spring.sql.init.mode=${CLINICA_DB_INIT:never}
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql
