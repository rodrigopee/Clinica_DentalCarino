# ===================================================================
# CONFIGURACIÓN GENERAL DEL SISTEMA CLÍNICA ODONTOLÓGICA
# ===================================================================
spring.application.name=sistema-clinica-odontologica
server.port=8080

# Profile por defecto: H2 en memoria con inicialización automática
# Para cambiar a MySQL, activa el profile: spring.profiles.active=mysql
spring.profiles.active=dev

# Configuración H2 para desarrollo y pruebas inmediatas
spring.datasource.url=jdbc:h2:mem:clinicadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 para inspeccionar tablas en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Servir archivos estáticos del frontend
spring.web.resources.static-locations=classpath:/static/

# Configuración de Jackson (fechas ISO)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
